<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 速报 - 最新AI主题新闻</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 顶部导航栏 -->
    <header class="top-nav">
        <div class="nav-container">
            <div class="nav-brand">
                <h1>AI 速报</h1>
                <p>最新AI主题新闻展示平台</p>
            </div>
            <nav class="nav-menu">
                <ul class="page-nav">
                    <li class="nav-item" data-page="vocabulary">记单词</li>
                    <li class="nav-item active" data-page="ai-news">AI 速报</li>
                </ul>
            </nav>
            <div class="nav-info">
                <div class="update-time" id="update-time">
                    最新更新: <span id="last-update">加载中...</span>
                </div>
            </div>
        </div>
    </header>

    <!-- 主要内容区 -->
    <main class="main-content">
        <div class="container">
            <!-- 新闻卡片列表 -->
            <div class="news-container" id="news-container">
                <!-- 新闻卡片将通过JavaScript动态生成 -->
            </div>
            
            <!-- 加载状态提示 -->
            <div class="loading-state" id="loading-state">
                <p>数据更新中，请稍后再试...</p>
            </div>
            
            <!-- 空状态提示 -->
            <div class="empty-state" id="empty-state" style="display: none;">
                <p>暂无最新 AI 新闻，敬请期待</p>
            </div>
        </div>
    </main>

    <!-- 底部信息 -->
    <footer class="site-footer">
        <div class="footer-container">
            <div class="footer-info">
                <p>基于 Vibe Coding 平台开发 | 数据更新周期：每6小时</p>
                <p>新闻来源：OpenAI, Google DeepMind, Anthropic, Meta AI, xAI, Every</p>
            </div>
            <div class="footer-copyright">
                <p>&copy; 2026 AI 速报. 保留所有权利.</p>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>

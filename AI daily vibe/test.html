<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试页面</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 2rem;
        }
        .test-btn {
            padding: 10px 20px;
            background-color: #165DFF;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .test-btn:hover {
            background-color: #0f49d1;
        }
        .result {
            margin-top: 20px;
            padding: 10px;
            background-color: #f0f0f0;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <h1>记单词应用测试</h1>
    <p>点击按钮测试JavaScript是否能正常运行：</p>
    <button class="test-btn" onclick="testVocabularyApp()">测试应用</button>
    <div class="result" id="result"></div>

    <script>
        function testVocabularyApp() {
            const result = document.getElementById('result');
            result.innerHTML = '<p>测试中...</p>';
            
            try {
                // 测试localStorage
                localStorage.setItem('test', 'test-value');
                const testValue = localStorage.getItem('test');
                localStorage.removeItem('test');
                
                result.innerHTML = `
                    <p>✅ 测试通过！</p>
                    <p>localStorage 正常工作</p>
                    <p>JavaScript 可以正常执行</p>
                    <p>现在你可以直接在浏览器中打开 vocabulary.html 文件</p>
                `;
            } catch (error) {
                result.innerHTML = `
                    <p>❌ 测试失败：${error.message}</p>
                    <p>建议使用本地服务器访问文件</p>
                `;
            }
        }
    </script>
</body>
</html>
